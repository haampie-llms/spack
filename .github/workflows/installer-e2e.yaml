name: installer e2e (temporary)

on:
  push:
    branches: [tmp/installer-e2e-windows]
  workflow_dispatch:

jobs:
  e2e:
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest]
    runs-on: ${{ matrix.os }}
    steps:
    - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0  # v7.0.0
    - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1  # v6.3.0
      with:
        python-version: '3.14'
    - name: Install Python packages
      run: python -m pip install -r .github/workflows/requirements/unit_tests/requirements.txt clingo==5.8.0
    - name: Windows test setup
      if: runner.os == 'Windows'
      run: ./share/spack/qa/windows_test_setup.ps1
    - name: Installer unit tests
      run: python -m pytest lib/spack/spack/test/installer -q -p no:cacheprovider
    - name: Installer end-to-end
      run: python .github/workflows/bin/installer_e2e.py
