# This environment contains software that Spack needs, for the following configuration
#
# Python spec: {{ python_spec }}
# Python interpreter: {{ python_prefix }}
# Architecture: {{ architecture }}
#
spack:
  specs:
  # Bootstrapping adds specs to this group together with their concrete specs, since clingo
  # cannot concretize itself
  - group: {{ core_group }}
    specs: []
  - group: {{ dev_group }}
    specs: [{% for spec in dev_specs %}"{{ spec }}"{% if not loop.last %}, {% endif %}{% endfor %}]
    override:
      packages:
        python-venv:
          buildable: false
        py-typed-ast:
          require: "+wheel"
        py-platformdirs:
          require: "+wheel"
      concretizer:
        targets:
          granularity: generic
          host_compatible: false
      # Signed binaries of the development dependencies
      mirrors::
        developer-tools-darwin:
          url: https://binaries.spack.io/releases/v2026.03/developer-tools-darwin
          signed: true
        developer-tools-x86_64_v3-linux-gnu:
          url: https://binaries.spack.io/releases/v2026.03/developer-tools-x86_64_v3-linux-gnu
          signed: true
        developer-tools-aarch64-linux-gnu:
          url: https://binaries.spack.io/releases/v2026.03/developer-tools-aarch64-linux-gnu
          signed: true

  view:
    default:
      root: {{ view }}
      group: {{ dev_group }}

  config:
    install_tree:
      root: {{ store_path }}
      padded_length: 0
    install_status: false
    # Binaries verified by sha256 sum are supported only by the new installer
    installer: new

  modules::
    default:
      enable: []

  packages:
    all:
      deprecation:
        allow:
          # Pinned binaries can be of versions that were deprecated after they were built,
          # and Python deprecation cycles are very fast
          - labels: [version_deprecated]

    python:
      buildable: false
      externals:
        - spec: "{{ python_spec }}"
          prefix: "{{ python_prefix }}"
