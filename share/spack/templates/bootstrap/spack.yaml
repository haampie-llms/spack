# This environment contains software that Spack needs, for the following configuration
#
# Python spec: {{ python_spec }}
# Python interpreter: {{ python_prefix }}
# Architecture: {{ architecture }}
#
spack:
  specs:
  # Concrete specs are added to this group without the concretizer, since clingo is among them
  - group: {{ core_group }}
    specs: []
  - group: {{ dev_group }}
    specs: [{% for spec in dev_specs %}"{{ spec }}"{% if not loop.last %}, {% endif %}{% endfor %}]
    override:
      packages:
        python-venv:
          buildable: false
        py-typed-ast:
          require: "+wheel"
        py-platformdirs:
          require: "+wheel"
      concretizer:
        reuse: true
        unify: true
        targets:
          granularity: generic
          host_compatible: false
      # Signed binaries of the development dependencies
      mirrors::
{% for mirror in dev_mirrors %}
        {{mirror}}:
          url: https://binaries.spack.io/releases/v2026.03/{{mirror}}
          signed: true
{% endfor %}

  view:
    default:
      root: {{ view }}
      group: {{ dev_group }}

  config:
    install_tree:
      root: {{ store_path }}
      padded_length: 0
    install_status: false
    # Binaries verified by sha256 sum are supported only by the new installer
    installer: new

  modules::
    default:
      enable: []

  packages:
    all:
      deprecation:
        allow:
          # Pinned binaries can be of versions that were deprecated after they were built,
          # and Python deprecation cycles are very fast
          - labels: [version_deprecated]

    python:
      buildable: false
      externals:
        - spec: "{{ python_spec }}"
          prefix: "{{ python_prefix }}"
